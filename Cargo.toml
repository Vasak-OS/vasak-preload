[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/config",
    "crates/orchestrator",
    "crates/daemon",
    "crates/protocol",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["VasakOS Team <team@vasakos.org>"]
repository = "https://github.com/Vasak-OS/vasak-preload"
description = "System optimizer for VasakOS: prefetches binaries and libraries based on usage patterns"
version = "0.1.2"

[workspace.dependencies]
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
proptest = "1.9.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.18"
async-trait = "0.1.89"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.16.1"
toml_edit = { version = "0.25.0", features = ["serde"] }
slotmap = "1.1.1"
procfs = "0.18.0"
nix = { version = "0.31.1", features = ["fs", "process", "signal"] }
sqlx = { version = "0.9.0", features = ["macros", "runtime-tokio", "sqlite"] }
rkyv = { version = "0.8.14", features = ["bytecheck"] }
moka = { version = "0.12.8", features = ["sync"] }
clap = { version = "4.5.56", features = ["derive"] }
tempfile = "3.24.0"
libc = "0.2.180"
zbus = { version = "5.19", features = ["tokio"] }
zvariant = { version = "5.15" }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"

[profile.test.package.proptest]
opt-level = 2

[workspace.lints.clippy]
print_stderr = "warn"
print_stdout = "warn"
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Sólo el usuario del servicio puede tomar el nombre en el bus del sistema. -->
  <policy user="vasak-preload">
    <allow own="org.vasakos.Preload"/>
  </policy>

  <!-- root controla el servicio: puede llamar cualquier método. -->
  <policy user="root">
    <allow send_destination="org.vasakos.Preload"/>
  </policy>

  <!-- El resto puede leer el estado y consultar predicciones, pero no
       controlar el servicio: Pause, Resume, SaveNow y ReloadConfig quedan
       fuera (sólo root), para que un usuario cualquiera no pueda apagar el
       prefetch ni forzar guardados. -->
  <policy context="default">
    <allow send_destination="org.vasakos.Preload"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.vasakos.Preload"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.vasakos.Preload"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.vasakos.Preload"
           send_interface="org.vasakos.Preload1"
           send_member="GetTopPredictions"/>
    <allow send_destination="org.vasakos.Preload"
           send_interface="org.vasakos.Preload1"
           send_member="GetExeState"/>
  </policy>
</busconfig>
